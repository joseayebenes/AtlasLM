# atlas.dev.toml — desarrollo en el portátil con Ollama y los datos de examples/samples/
[project]
name = "atlas-dev"
workspace = "./workspace-dev"
log_level = "INFO"

[llm]
base_url = "http://localhost:11434/v1"     # Ollama. LM Studio: http://localhost:1234/v1
model = "gemma4:12b"                       # en un Mac de 16 GB: gemma4:12b o gemma4:e4b
api_key = "local"
max_tokens = 8192
reasoning_effort = "none"                  # gemma4 razona por defecto: una sección tarda minutos en vez de segundos

[embeddings]
model = "embeddinggemma"
batch = 64

[network]
no_proxy = "*"                              # todo en local, sin proxy

[pipeline]
workers = 2
on_error = "continue"
max_attempts = 3
prune_missing = true
steps = ["doors", "code", "docs", "graph", "index"]

[plugins]
modules = []                                # p. ej. ["mi_paquete.analizador_cpp"]
disabled = []                               # p. ej. ["code_analyzer:ada"]

[[sources.docs]]
name = "normas"
paths = ["examples/samples/docs"]
patterns = ["*.pdf"]
analysis = "regex"                          # llm | regex | none; regex: requisitos sin LLM
req_regex = "(?i)\\bReq\\s*:\\s*(\\S+)"     # grupo 1 = ID; el texto sigue hasta el final de la frase
structure = "auto"                          # auto | bookmarks | headings | size

[[sources.docs]]
name = "manuales"
paths = ["examples/samples/docs"]
patterns = ["*.md"]
analysis = "llm"
lang = "Spanish"
min_chars = 300

[sources.doors]
adapter = "exchange"                        # la base de intercambio de requisitos (atlas.doors.exchange)
modules = ["SSS_MISSION", "SRS_TMS", "STP_TMS"]   # SRS_TMS_OLD queda fuera

[sources.doors.exchange]
path = "examples/samples/requirements.sqlite"   # la rellena tools/doors_export (aquí, make_samples.py)
kinds = ["requirement", "heading", "information"]

[sources.doors.convention]                  # cómo casan los IDs con documentos y código
id_pattern = "^(?:SRS|SSS|STP)-\\d{4}$"
id_normalize = "upper"
inline_reference_regex = "\\b(?:SRS|SSS)-\\d{4}\\b"
inline_reference_type = "references"
link_semantics = { derives = ["satisfies", "refines", "derives_from"], verifies = ["verifies"], ignore = ["references"] }
top_modules = ["SSS_MISSION"]               # los requisitos de sistema: no derivan de nada

[sources.code]
roots = ["examples/samples/ada"]
languages = ["ada"]
exclude = ["**/build/**"]
req_tag = "Req:"
test_patterns = ["**/tests/**"]
summaries = "none"
# el compilador para los agentes (check_code, run_test): GNAT instalado con Alire
#   alr toolchain --select gnat_native gprbuild
check_command = ["gcc", "-c", "-gnatc", "{include}", "{file}"]
test_command = ["gnatmake", "-q", "{include}", "-D", "{build}", "{file}", "-o", "{exe}"]
tool_path = ["~/.local/share/alire/toolchains/gnat_native_*/bin"]

[graph]
exports = ["graphml", "json"]               # grafo completo en <workspace>/graph/atlas.*
communities = false                         # true: grupo de código (Louvain) en cada nodo, para Gephi

[index]
chunk_chars = 1200
chunk_overlap = 200

[search]
scope_chars = 30000                         # OLLAMA_CONTEXT_LENGTH=16384: unos 30 000 caracteres por petición

[agents]                                    # agentes: ficheros Markdown (atlas/agents/builtin y dirs)
model = "gemma4:12b"                        # vacío: el de [llm]
dirs = ["agents", "examples/agents"]        # carpetas con los .md del proyecto (examples/agents: implementer y tester)
[agents.assistant]                          # retoques de un agente sin tocar su fichero
max_steps = 10
[agents.eval]                               # atlas eval: preguntas y búsquedas con respuesta conocida
sets = ["examples/eval/assistant.yaml",     # el asistente (necesita el modelo)
        "examples/eval/retrieval.yaml"]     # el índice y el grafo, sin modelo
runs = 1                                    # veces que se hace cada pregunta

[mcp]                                       # atlas serve: servidor MCP para OpenCode, VS Code...
enabled = true
tools = []                                  # vacío: las del perfil; o una lista, p. ej.
                                            # ["search", "get_requirement", "trace", "impact", "read_source"]
# profile = "editor"                         # editor (por defecto con código) | trace | all

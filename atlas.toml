# atlas.toml — producción (gateway corporativo), sobre atlas/templates/atlas-gateway.toml
# (atlas init --profile gateway). Copia atlas.dev.toml y cambia solo esto:
[project]
name = "tms"
workspace = "C:/atlas/tms"

[llm]
base_url = "https://llm-gateway.empresa/v1"
model = "gemma-4"                    # gemma 4 26B A4B: unos 200 000 tokens de entrada
api_key = "${ATLAS_API_KEY}"         # setx ATLAS_API_KEY "la-clave"
max_tokens = 8192
reasoning_effort = "none"            # gemma 4 razona por defecto; un agente que lo necesita lo
                                     # enciende en su fichero (reasoning_effort: low)

[embeddings]
model = "embeddinggemma"
batch = 64

[network]
proxy = "${HTTPS_PROXY:-}"
ca_cert = "system"
requests_per_minute = 28
max_concurrent = 6

[pipeline]
workers = 6
steps = ["doors", "code", "docs", "graph", "index"]

[[sources.docs]]
name = "documentos"
paths = ["C:/atlas/tms/docs"]
patterns = ["*.pdf", "*.md"]
analysis = "llm"
lang = "Spanish"

[sources.doors]
adapter = "exchange"                 # la base que publica tools/doors_export (o cualquier otro relleno)
[sources.doors.exchange]
path = "C:/atlas/tms/requirements.sqlite"
[sources.doors.convention]
id_pattern = "^(?:SRS|SSS)-\\d{3,6}$"
inline_reference_regex = "\\b(?:SRS|SSS)-\\d{3,6}\\b"
# Para leer otra base con consultas propias: adapter = "database" y [sources.doors.database]
# (driver sqlite u odbc, modules_query, requirements_query...; ver atlas/doors/__init__.py).

[sources.code]
roots = ["C:/src/tms"]
languages = ["ada"]
test_patterns = ["**/tests/**"]       # sus subprogramas son pruebas: verifican y cubren requisitos

[search]                             # cambiarlo no reprocesa nada
scope_chars = 300000                 # una pregunta amplia lee de una vez hasta esto (cabe en los 200 000 tokens)

[agents]                             # agentes: ficheros Markdown con cabecera YAML (ver README)
dirs = ["agents"]                    # los .md del proyecto, junto a este fichero

[mcp]                                # atlas serve atlas.toml: servidor MCP para OpenCode, VS Code...
tools = []                           # vacío: las del perfil; edit_file y write_file solo si se piden
# profile = "editor"                 # editor (con código) | trace | all (sin código)

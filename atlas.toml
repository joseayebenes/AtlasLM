# atlas.toml — producción (gateway corporativo). Copia atlas.dev.toml y cambia solo esto:
[project]
name = "tms"
workspace = "C:/atlas/tms"

[llm]
base_url = "https://llm-gateway.empresa/v1"
model = "gemma-4"
api_key = "${GW_KEY}"
max_tokens = 8192

[embeddings]
model = "embeddinggemma"
batch = 64

[network]
proxy = "${HTTPS_PROXY:-}"
ca_cert = "system"
requests_per_minute = 28

[pipeline]
workers = 6
steps = ["doors", "code", "docs", "graph", "index"]

[sources.doors]
adapter = "exchange"                 # la base que publica tools/doors_export (o cualquier otro relleno)
[sources.doors.exchange]
path = "C:/atlas/tms/requirements.sqlite"
[sources.doors.convention]
id_pattern = "^(?:SRS|SSS)-\\d{3,6}$"
inline_reference_regex = "\\b(?:SRS|SSS)-\\d{3,6}\\b"
# Para leer otra base con consultas propias: adapter = "database" y [sources.doors.database]
# (driver sqlite u odbc, modules_query, requirements_query...; ver atlas/doors/__init__.py).

[sources.code]
roots = ["C:/src/tms"]
languages = ["ada"]

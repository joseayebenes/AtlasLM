- id: search-paraphrase-display
  search: show the tracks on the operator screen
  expect: [display tracks]
  tags: [paraphrase]
- id: search-open-issue
  search: what is still to be defined about the alarms
  expect: [latency is TBD]
  tags: [paraphrase]

# --- search: other languages (the documents are in English)
- id: search-spanish-logs
  search: ¿cuántos días se guardan los registros de la HMI?
  expect: [30 days]
  tags: [paraphrase, spanish]
- id: search-spanish-alarm
  search: alarma cuando se pierde una traza
  expect: [alarm when a track is lost]
  tags: [paraphrase, spanish]

# --- search: sections and documents
- id: search-section-logging
  search: logging section of the HMI manual

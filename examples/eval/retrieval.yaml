# Retrieval set over the samples, scored without a model: atlas eval atlas.dev.toml
# A search case ranks the results of the index (hybrid and lexical); a graph case checks
# that the result of the query contains every expected text. The samples are synthetic and
# repetitive: this set is a baseline and a regression check; the figure that matters comes
# from a set written over the real project. `tags` give the figures by type of case
# (id, words, paraphrase, spanish, section, code; trace, impact and code in the graph).

# --- search: exact identifiers
- id: search-id-srs-0102
  search: SRS-0102
  expect: [SRS-0102]
  tags: [id]
- id: search-id-sss-0005
  search: SSS-0005
  expect: [capability 5]
  tags: [id]
- id: search-two-ids
  search: SRS-0004 and SSS-0005
  expect: [track event 4 within 320, capability 5]
  tags: [id]

# --- search: the words of the text
- id: search-logs-30-days
  search: keep logs for 30 days
  expect: [30 days]
  tags: [words]
- id: search-alarm-track-lost
  search: alarm when a track is lost
  expect: [alarm when a track is lost]
  tags: [words]
- id: search-event-of-group
  search: track event 3 of group 2.3.2
  expect: [track event 3 of group 2.3.2]
  tags: [words]
- id: search-refines
  search: which requirement refines SRS-0009
  expect: [refines SRS-0009]
  tags: [words]
- id: search-doors-deadline
  search: process track event 17
  expect: [track event 17 within]
  kinds: [requirement]
  tags: [words]

# --- search: paraphrases (other words than the text)
- id: search-paraphrase-logs
  search: how long does the HMI retain its log files
  expect: [30 days]
  tags: [paraphrase]
- id: search-paraphrase-alarm
  search: warning raised when the radar loses a target
  expect: [alarm when a track is lost]

  tags: [section]
- id: search-function-group
  search: Function group 1.2
  expect: [1.2 Function group 1.2]
  tags: [section]
- id: search-mission-capabilities
  search: mission system capabilities
  expect: [The mission system shall provide capability]
  tags: [section]

# --- search: the code (each subprogram, type and variable, with its comment and code)
- id: search-code-remove-track
  search: which subprogram removes a track from the database
  expect: [tracks.delete_track]
  tags: [code]
- id: search-code-log
  search: code that writes a line to the log
  expect: [logger.log]
  tags: [code]
- id: search-code-hours
  search: type for the hours of the day
  expect: [tracks.hour_range]
  tags: [code]

# --- graph: traceability, impact and code, without a model
- id: graph-trace-srs-0004

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doors-kb"
version = "0.4.0"
description = "MCP de solo lectura y base de conocimiento local para IBM DOORS Classic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# El nucleo (modelos, repositorio SQLite, sincronizacion) no depende de Windows
# ni de DOORS: eso es lo que permite ejecutar toda la suite de tests en cualquier
# plataforma (RNF-013).
dependencies = [
    # MCP 2.x: FastMCP paso a llamarse MCPServer y la API cambio, asi que el rango se
    # acota a esa mayor en lugar de aceptar ambas.
    "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
# pywin32 solo se instala en Windows; el cliente COM se importa de forma perezosa
# para que el resto del paquete siga siendo importable en Linux/macOS.
win = ["pywin32>=306; sys_platform == 'win32'"]
# La busqueda vectorial multiplica una matriz de embeddings por el vector de consulta.
# En Python puro eso son segundos por consulta; con numpy, milisegundos. Va en un extra y
# no en el nucleo porque solo lo necesitan los hitos H5 y H6 (ADR-011).
embeddings = ["numpy>=1.26"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "numpy>=1.26",
]

[project.scripts]
doors-sync = "doors_kb.cli.sync_doors:main"
doors-embed = "doors_kb.cli.embed:main"
doors-search = "doors_kb.cli.search:main"
doors-selftest = "doors_kb.cli.selftest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doors_kb = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaslm"
version = "0.0.1"
description = "Base de conocimiento de ingeniería: documentos, requisitos, código y grafo, con agentes ADK"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "numpy>=1.24", "pyyaml>=6", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
docs = ["markitdown[pdf]", "pymupdf"]
code = ["tree-sitter>=0.23", "tree-sitter-ada", "networkx"]
agents = ["google-adk"]
mcp = ["mcp"]
dev = ["pytest>=8", "pymupdf"]

[project.scripts]
atlas = "atlas.cli:main"

[project.entry-points."atlas.plugins"]
# Los plugins externos se declaran así en su propio pyproject:
# mi_plugin = "mi_paquete.mi_modulo"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.agents" = ["builtin/*.md"]            # los agentes de serie

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a local Ollama with the atlas.dev.toml models (skipped otherwise)"]
filterwarnings = ["ignore:.*EXPERIMENTAL.*:UserWarning"]       # notices of ADK about its own features

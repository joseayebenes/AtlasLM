[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaslm"
dynamic = ["version"]                        # atlas.__version__
description = "Base de conocimiento de ingeniería: documentos, requisitos, código y grafo, con agentes ADK"
readme = "README.md"
requires-python = ">=3.10"
# Rangos compatibles. constraints.txt fija la versión exacta de todo lo que se instaló al pasar
# las pruebas (pip install ... -c constraints.txt). ADK, a una versión menor: su API cambia.
dependencies = [
    "openai>=1.40,<3",
    "numpy>=1.24,<3",
    "pyyaml>=6,<7",
    "truststore>=0.9,<1",                    # ca_cert = "system": el almacén de certificados del sistema
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
docs = ["markitdown[pdf]>=0.1.2,<0.2", "pymupdf>=1.24,<2"]
code = ["tree-sitter>=0.23,<0.27", "tree-sitter-ada>=0.1,<0.2", "networkx>=3,<4"]
mcp = ["mcp>=2.3,<3"]
agents = ["google-adk>=2.11,<2.12"]
xlsx = ["openpyxl>=3.1,<4"]                  # atlas matrix en .xlsx; wheel puro (con et-xmlfile)
all = ["atlaslm[docs,code,mcp,agents]"]
dev = ["pytest>=8", "pymupdf>=1.24,<2", "build>=1", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "pip-audit>=2.7,<3"]

[project.scripts]
atlas = "atlas.cli:main"

[project.entry-points."atlas.plugins"]
# Los plugins externos se declaran así en su propio pyproject:
# mi_plugin = "mi_paquete.mi_modulo"

[tool.setuptools.dynamic]
version = {attr = "atlas.__version__"}

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.agents" = ["builtin/*.md"]            # los agentes de serie
"atlas" = ["templates/*.toml"]               # las plantillas de atlas init (ollama y gateway)
"atlas.code" = ["hints.toml", "rules.toml"]   # las pistas y las reglas de serie

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=15"                   # the 15 slowest tests at the end of every run
markers = ["model: needs the real model of ATLAS_TEST_CONFIG (atlas.dev.toml by default); skipped if atlas check fails",
           "ollama: the old name of the marker model (the same tests)",
           "slow: starts processes, waits or takes seconds (make test-fast leaves them out)"]
filterwarnings = ["ignore:.*EXPERIMENTAL.*:UserWarning",       # notices of ADK about its own features
                  "ignore:builtin type [Ss]wig.* has no __module__:DeprecationWarning"]   # pymupdf on Python 3.13

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# The style of the project: names of one letter, lambdas assigned, several statements on a line.
ignore = ["E501", "E741", "E731", "E701", "E702",
          # Not cleaned yet: each one leaves this list when the code is corrected.
          "UP035", "UP037", "UP012", "UP031", "B905", "B023", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/fakes/*" = ["E401"]                   # the fakes, a few lines each: imports on one line too
"tests/*" = ["B017"]                         # pytest.raises(Exception) where any failure will do

[tool.mypy]
# python_version is the one that runs mypy: with 3.10 fixed, the stubs of numpy for Python 3.12
# and later (type statements) do not parse. The CI runs it on 3.10, 3.12 and 3.13.
ignore_missing_imports = true
warn_unused_ignores = true

# Modules with errors still: each one leaves this list when it is cleaned, package by package.
[[tool.mypy.overrides]]
module = [
    "atlas.agents.comply",
    "atlas.agents.context",
    "atlas.agents.develop",
    "atlas.agents.evaluate",
    "atlas.agents.link",
    "atlas.agents.model",
    "atlas.agents.runtime",
    "atlas.agents.verify",
    "atlas.cli",
    "atlas.code.ada",
    "atlas.code.build",
    "atlas.code.files",
    "atlas.code.library",
    "atlas.code.lsp",
    "atlas.code.procedures",
    "atlas.code.python",
    "atlas.code.reference",
    "atlas.code.symbols",
    "atlas.code.tools",
    "atlas.docs",
    "atlas.docs.analysis",
    "atlas.docs.process",
    "atlas.docs.structure",
    "atlas.doors",
    "atlas.graph.build",
    "atlas.graph.knowledge",
    "atlas.index",
    "atlas.index.embeddings",
    "atlas.index.records",
    "atlas.index.search",
    "atlas.llm.connection",
    "atlas.mcp",
    "atlas.pipeline",
    "atlas.plugins",
]
ignore_errors = true
